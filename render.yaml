services:
  - type: web
    name: maternal-diet-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_API_KEY
        sync: false   # secret: Render asks for it during setup
